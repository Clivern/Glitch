version: 1.0.0

# Glitch sandbox — PR triage only.

labels:
  - { name: spam, color: "B60205", description: "Closed as spam" }
  - { name: bot, color: "EEEEEE", description: "Opened by a bot" }
  - { name: first-contribution, color: "0E8A16", description: "Author's first pull request" }
  - { name: team/sre, color: "5319E7", description: "Author is on the sre team" }
  - { name: community, color: "C5DEF5", description: "Author is not on the sre team" }
  - { name: hotfix, color: "D93F0B", description: "Title or body matches hotfix" }
  - { name: needs-triage, color: "FBCA04", description: "Removed when a rule matches" }
  - { name: bug, color: "D93F0B", description: "AI: bug" }
  - { name: enhancement, color: "A2EEEF", description: "AI: enhancement" }
  - { name: docs, color: "0075CA", description: "AI: docs" }
  - { name: security, color: "B60205", description: "AI: security" }
  - { name: draft, color: "C5DEF5", description: "PR is a draft" }
  - { name: ready, color: "0E8A16", description: "PR is ready for review (not draft)" }
  - { name: closed-again, color: "CCCCCC", description: "Matched a closed PR" }
  - { name: area/python, color: "3572A5", description: "Changes under python/" }
  - { name: area/review, color: "5319E7", description: "Changes under review-code/" }
  - { name: lang/python, color: "3572A5", description: "PR changes Python files" }
  - { name: lang/yaml, color: "8E44AD", description: "PR changes YAML files" }
  - { name: lang/md, color: "0075CA", description: "PR changes Markdown files" }
  - { name: size/s, color: "2ECC71", description: "Small PR (20 files or fewer)" }
  - { name: size/l, color: "E67E22", description: "Large PR (21+ files)" }

teams:
  - name: sre
    members: [clivern]

knowledge:
  - path: README.md
    tags:
      tag: docs

# Issue triage off — this pass is PR triage only.
issue_triage:
  enabled: false

pr_triage:
  enabled: true
  comments: outcomes
  ai:
    enabled: true
    max_prs_opened: { count: 50, within: 24h }
    except:
      - or:
          - author_in: [dependabot, ziee-bot]
          - author_in_team: [sre]
    knowledge:
      - tag: docs
  commands:
    label:
      allow:
        - users: [clivern]
        - teams: [sre]
    unlabel:
      allow:
        - users: [clivern]
        - teams: [sre]
    assign:
      allow:
        - users: [clivern]
        - self: true
    unassign:
      allow:
        - users: [clivern]
        - teams: [sre]
    reviewers:
      allow:
        - users: [clivern]
        - teams: [sre]
    close:
      allow:
        - users: [clivern]
        - teams: [sre]
    reopen:
      allow:
        - users: [clivern]
        - teams: [sre]
        - self: true
    spam:
      allow:
        - users: [clivern]
        - teams: [sre]
    summarize:
      allow:
        - users: [clivern]
        - teams: [sre]
        - self: true
  rules:
    - name: rate-limit
      when:
        - author_not_in: [dependabot, ziee-bot]
        - author_not_in_team: [sre]
        - max_prs_opened: { count: 100, within: 24h }
      labels:
        add: [spam]
      close: true
      block_author: true
      comment: "Too many pull requests in 24h."

    - name: blocked-authors
      when:
        - author_in: [known-spammer]
      labels:
        add: [spam]
      close: true
      block_author: true
      comment: "This account is blocked from opening pull requests here."

    - name: spam-blocklist
      when:
        - author_blocked
      labels:
        add: [spam]
      close: true
      comment: "This account is on the blocklist."

    - name: spam
      when:
        - author_not_in: [dependabot, ziee-bot]
        - author_not_in_team: [sre]
        - intention:
            name: spam
            description: >-
              Unsolicited promo, phishing, crypto/SEO spam, nonsense,
              or content unrelated to this repository. Not a real bug,
              feature, or docs change.
      labels:
        add: [spam]
      close: true
      block_author: true
      comment: "Closed as spam."

    - name: area-python
      when:
        - files: [python/**]
      labels:
        add: [area/python]
      assign: [clivern]

    - name: area-review
      when:
        - files: [review-code/**]
      labels:
        add: [area/review]
      assign: [clivern]

    - name: lang-python
      when:
        - files: ["**/*.py"]
      labels:
        add: [lang/python]

    - name: lang-yaml
      when:
        - files: ["**/*.yml", "**/*.yaml"]
      labels:
        add: [lang/yaml]

    - name: lang-md
      when:
        - files: ["**/*.md"]
      labels:
        add: [lang/md]

    - name: size-s
      when:
        - max_files_changed: 20
      labels:
        add: [size/s]

    - name: size-l
      when:
        - min_files_changed: 21
      labels:
        add: [size/l]
        remove: [size/s]
      assign: [clivern]

    - name: bot
      when:
        - author_in: [dependabot, ziee-bot]
      labels:
        add: [bot]

    - name: first-contribution
      when:
        - author_not_in: [dependabot, ziee-bot]
        - first_contribution
      labels:
        add: [first-contribution]
      comment: "Welcome — thanks for the first pull request."

    - name: from-sre
      when:
        - author_in_team: [sre]
      labels:
        add: [team/sre]

    - name: not-sre
      when:
        - author_not_in_team: [sre]
      labels:
        add: [community]

    - name: title-hotfix
      when:
        - title: "hotfix"
      labels:
        add: [hotfix]
        remove: [needs-triage]
      assign: [clivern]

    - name: body-hotfix
      when:
        - body: "hotfix"
      labels:
        add: [hotfix]
      comment: "Body matched hotfix."

    - name: draft
      when:
        - draft
      labels:
        add: [draft]
        remove: [ready]

    - name: ready
      when:
        - -draft
      labels:
        add: [ready]
        remove: [draft]

    - name: when-closed
      when:
        - closed
      labels:
        add: [closed-again]

    - name: bug
      when:
        - author_not_in: [dependabot, ziee-bot]
        - intention:
            name: bug
            description: "A defect or unexpected behavior that needs a fix."
      labels:
        add: [bug]
      assign: [clivern]
      comment: "Thanks — we'll look at this bug fix PR."

    - name: enhancement
      when:
        - author_not_in: [dependabot, ziee-bot]
        - intention: enhancement
      labels:
        add: [enhancement]

    - name: docs
      when:
        - author_not_in: [dependabot, ziee-bot]
        - intention:
            name: docs
            description: "Documentation-only changes."
      labels:
        add: [docs]
      assign: [clivern]

    - name: security
      when:
        - author_not_in: [dependabot, ziee-bot]
        - intention: security
      labels:
        add: [security]
      assign: [clivern]

assistant:
  history: 20
  issues:
    enabled: false
  pull_requests:
    enabled: false

merge_queue:
  enabled: false

pr_reviews:
  enabled: false

flows:
  enabled: false
